spring.application.name=ecommerce
server.port=8080

# ---------- Database (MySQL 8) ----------
# Values after the colon are defaults. Override with environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# ---------- JPA / Hibernate ----------
# Tables come from database/schema.sql, so Hibernate only checks them (never changes them)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Dev-only secret (Base64, 256-bit). Use a new secret from the JWT_SECRET env variable in production.
app.jwt.secret=${JWT_SECRET:raSbNc9NwJCkffbuxGd4dAIA43ukGKdbsSSg6hQsNsA=}
# 24 hours in milliseconds
app.jwt.expiration-ms=86400000

# ---------- CORS (React dev server, Vite default port) ----------
app.cors.allowed-origins=http://localhost:5173
